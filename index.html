  :root {
    --bg: #F2F5F9;
    --surface: #FFFFFF;
    --surface-2: #E8EEF4;
    --ink: #12284A;
    --text: #1C2A3A;
    --muted: #586A7E;
    --line: #D2DBE5;
    --accent: #1D7688;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEFF2;
    --bar: #12284A;
    --bar-text: #FFFFFF;
    --bar-muted: #A9BCD4;
    --safe: #1B8453;
    --safe-soft: #E0F3E9;
    --warn: #9C6400;
    --warn-soft: #FCF0D6;
    --danger: #C22F2F;
    --danger-soft: #FBE4E4;
    --housing: #232D3A;
    --lamp-off: #3A4654;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Archivo", "Instrument Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0C141F; --surface: #132030; --surface-2: #1A2A3D; --ink: #E9F0F8; --text: #D3DDE8;
      --muted: #8FA2B7; --line: #26384D; --accent: #4DB5C8; --accent-ink: #062129; --accent-soft: #15323B;
      --bar: #08101A; --bar-text: #EEF3F9; --bar-muted: #8FA2B7;
      --safe: #4CC38A; --safe-soft: #12301F; --warn: #E7AE45; --warn-soft: #362A10;
      --danger: #F07474; --danger-soft: #3B1A1D; --housing: #070C13; --lamp-off: #283341;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0C141F; --surface: #132030; --surface-2: #1A2A3D; --ink: #E9F0F8; --text: #D3DDE8;
    --muted: #8FA2B7; --line: #26384D; --accent: #4DB5C8; --accent-ink: #062129; --accent-soft: #15323B;
    --bar: #08101A; --bar-text: #EEF3F9; --bar-muted: #8FA2B7;
    --safe: #4CC38A; --safe-soft: #12301F; --warn: #E7AE45; --warn-soft: #362A10;
    --danger: #F07474; --danger-soft: #3B1A1D; --housing: #070C13; --lamp-off: #283341;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    padding-inline: 16px;
    padding-block: 0 40px;
  }
  .wrap { max-width: 1000px; margin-inline: auto; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- barra superior ---------- */
  .topbar { background: var(--bar); color: var(--bar-text); margin-inline: -16px; padding: 14px 16px; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .wordmark { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; margin: 0; }
  .wordmark .lite { font-weight: 600; font-stretch: 100%; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 3px; }
  .by { color: var(--bar-muted); font-size: 0.85rem; }
  .lang { display: inline-flex; border: 1.5px solid var(--bar-muted); border-radius: 8px; overflow: hidden; }
  .lang button { background: transparent; border: 0; color: var(--bar-muted); padding: 5px 12px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; }
  .lang button[aria-pressed="true"] { background: var(--bar-text); color: var(--bar); }

  /* ---------- pestañas ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-block: 20px 28px; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--ink); }

  h1, h2, h3 { color: var(--ink); text-wrap: balance; }
  h1 { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: clamp(1.6rem, 4.2vw, 2.35rem); line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 6px; }
  h2 { font-family: var(--display); font-stretch: 108%; font-weight: 750; font-size: 1.15rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
  .eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* ---------- formulario ---------- */
  .check { display: flex; gap: 10px; flex-wrap: wrap; }
  .check label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .check input {
    flex: 1 1 280px; min-width: 0; font-family: var(--mono); font-size: 0.95rem;
    padding: 14px 16px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface);
  }
  .check input:focus { border-color: var(--accent); outline: none; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 14px 26px; font-weight: 700; font-size: 1rem; }
  .btn-primary:hover { filter: brightness(1.08); }
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .examples span { color: var(--muted); font-size: 0.88rem; margin-right: 4px; }
  .chip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; font-weight: 600; color: var(--text); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- resultado ---------- */
  .result { margin-top: 28px; }
  .lvl-low { --lvl: var(--safe); --lvl-soft: var(--safe-soft); }
  .lvl-med { --lvl: var(--warn); --lvl-soft: var(--warn-soft); }
  .lvl-high { --lvl: var(--danger); --lvl-soft: var(--danger-soft); }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 780px) { .grid { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); align-items: start; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .verdict { border-top: 5px solid var(--lvl); display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
  .light { background: var(--housing); border-radius: 34px; padding: 10px; display: grid; gap: 9px; }
  .lamp { width: 40px; height: 40px; border-radius: 50%; background: var(--lamp-off); transition: background .3s, box-shadow .3s; }
  .lamp.on.r { background: var(--danger); box-shadow: 0 0 18px color-mix(in srgb, var(--danger) 65%, transparent); }
  .lamp.on.a { background: var(--warn); box-shadow: 0 0 18px color-mix(in srgb, var(--warn) 65%, transparent); }
  .lamp.on.g { background: var(--safe); box-shadow: 0 0 18px color-mix(in srgb, var(--safe) 65%, transparent); }
  .level { font-family: var(--display); font-stretch: 115%; font-weight: 800; font-size: 1.35rem; color: var(--lvl); letter-spacing: 0.01em; margin: 0; line-height: 1.15; }
  .score { font-family: var(--display); font-weight: 800; font-size: 2.1rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0 8px; }
  .score small { font-size: 1rem; color: var(--muted); font-weight: 600; }
  .meter { height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--lvl); border-radius: inherit; transition: width .5s ease; }
  .advice { grid-column: 1 / -1; background: var(--lvl-soft); border-radius: 8px; padding: 12px 14px; }
  .advice strong { display: block; color: var(--ink); margin-bottom: 2px; }
  .advice p { margin: 0; }
  .disclaimer { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); margin: 0; }

  .anatomy { display: flex; flex-wrap: wrap; row-gap: 12px; font-family: var(--mono); font-size: 0.95rem; margin-bottom: 6px; }
  .seg { display: flex; flex-direction: column; min-width: 0; }
  .seg code { font-family: inherit; padding: 6px 1px; border-bottom: 3px solid var(--line); word-break: break-all; color: var(--muted); }
  .seg small { font-family: var(--sans); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 5px; padding-right: 10px; }
  .seg.user code { color: var(--danger); text-decoration: line-through; border-color: var(--danger); }
  .seg.user small { color: var(--danger); }
  .seg.sub code { color: var(--warn); border-color: var(--warn); }
  .seg.sub small { color: var(--warn); }
  .seg.dom code { color: var(--ink); font-weight: 600; background: var(--accent-soft); border-color: var(--accent); padding-inline: 4px; }
  .seg.dom small { color: var(--accent); }
  .idn { font-size: 0.85rem; color: var(--muted); margin: 6px 0 0; }
  .idn code { font-family: var(--mono); color: var(--danger); }

  .reasons { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
  .reasons li { display: grid; grid-template-columns: 3.4rem 1fr; gap: 12px; align-items: start; }
  .pts { font-family: var(--mono); font-weight: 600; font-size: 0.85rem; text-align: center; border-radius: 6px; padding: 3px 0; color: #fff; background: var(--warn); font-variant-numeric: tabular-nums; }
  .pts.big { background: var(--danger); }
  :root[data-theme="dark"] .pts { color: #0C141F; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pts { color: #0C141F; } }
  .reasons b { display: block; color: var(--ink); font-weight: 650; }
  .reasons .rid { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-weight: 500; margin-right: 6px; }
  .reasons p { margin: 1px 0 0; color: var(--text); }
  .none { color: var(--muted); margin: 14px 0 0; }
  .notes { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .notes li { font-size: 0.88rem; color: var(--muted); padding-left: 16px; position: relative; }
  .notes li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .passed { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .passed-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ok { font-size: 0.78rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  .ok::before { content: "✓ "; color: var(--safe); font-weight: 700; }
  .error { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--ink); border-radius: 10px; padding: 14px 16px; }

  /* ---------- entrenamiento ---------- */
  .train-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .progress-text { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .progress span { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .train-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 780px) { .train-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
  .msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .msg-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
  .channel { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 2px 7px; }
  .fict { font-size: 0.78rem; color: var(--muted); }
  .msg-meta { padding: 14px 16px 0; display: grid; gap: 3px; font-size: 0.92rem; }
  .msg-meta span { color: var(--muted); display: inline-block; min-width: 4.2em; }
  .msg-meta .from { font-family: var(--mono); font-size: 0.85rem; word-break: break-all; }
  .msg-body { padding: 14px 16px 18px; }
  .bubble { background: var(--surface-2); border-radius: 16px 16px 16px 4px; padding: 12px 14px; max-width: 95%; }
  .msg-body p { margin: 0; }
  .fake-link { display: inline-block; margin-top: 10px; font-family: var(--mono); font-size: 0.88rem; color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; word-break: break-all; }
  .choices { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .choice { flex: 1 1 140px; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; border: 2px solid; }
  .choice.legit { background: var(--surface); color: var(--safe); border-color: var(--safe); }
  .choice.phish { background: var(--danger); color: #fff; border-color: var(--danger); }
  :root[data-theme="dark"] .choice.phish { color: #0C141F; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .choice.phish { color: #0C141F; } }
  .choice:disabled { opacity: 0.45; cursor: default; }
  .choice.picked { opacity: 1; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
  .feedback { border-radius: 12px; padding: 18px; border: 1px solid var(--line); background: var(--surface); }
  .feedback.good { background: var(--safe-soft); border-color: var(--safe); }
  .feedback.bad { background: var(--danger-soft); border-color: var(--danger); }
  .feedback h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .feedback .sub { margin: 0 0 12px; color: var(--ink); font-weight: 600; }
  .clues { margin: 0 0 16px; padding-left: 20px; display: grid; gap: 6px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 10px; padding: 11px 16px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 0.92rem; padding: 18px; border: 1px dashed var(--line); border-radius: 12px; }
  .end { text-align: left; }
  .end .big { font-family: var(--display); font-stretch: 115%; font-weight: 800; font-size: 3rem; color: var(--ink); line-height: 1; margin: 8px 0; font-variant-numeric: tabular-nums; }

  /* ---------- cómo funciona ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 0.9rem; }
  th { text-align: left; background: var(--ink); color: var(--bg); font-weight: 650; padding: 10px 12px; }
  td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  td code { font-family: var(--mono); font-size: 0.82rem; word-break: break-all; }
  td.num { text-align: center; font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
  .levels { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 12px; }
  .lv { border-radius: 10px; padding: 12px 14px; background: var(--lvl-soft); border-left: 5px solid var(--lvl); }
  .lv b { color: var(--lvl); font-family: var(--display); font-stretch: 112%; }
  .lv span { display: block; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin: 2px 0 4px; }
  .lv p { margin: 0; font-size: 0.9rem; }
  .info { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 16px; }
  .info .card p { margin: 0; }
  section + section { margin-top: 32px; }
  .block { margin-top: 28px; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">

      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap">

    <button type="button" role="tab" id="tab-analizar" data-tab="analizar" aria-selected="true" data-i18n="tabAnalyze"></button>
    <button type="button" role="tab" id="tab-entrenar" data-tab="entrenar" aria-selected="false" data-i18n="tabTrain"></button>
    <button type="button" role="tab" id="tab-reglas" data-tab="reglas" aria-selected="false" data-i18n="tabRules"></button>
  </nav>

  <main>
    <!-- ================= ANALIZADOR ================= -->
    <section id="panel-analizar" role="tabpanel">
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
      <form class="check" id="form-analizar" autocomplete="off">
        <label for="url" data-i18n="inputLabel"></label>
        <input id="url" name="url" type="text" spellcheck="false" autocapitalize="off" inputmode="url" data-i18n-ph="placeholder">
        <button class="btn-primary" type="submit" id="btn-analizar" data-i18n="analyze"></button>
      </form>
      <div class="examples" id="examples"></div>
      <div class="result" id="resultado" aria-live="polite"></div>
    </section>

    <!-- ================= ENTRENAMIENTO ================= -->
    <section id="panel-entrenar" role="tabpanel" hidden>
      <div class="train-head">
        <div>
          <h1 data-i18n="trainTitle"></h1>
          <p class="lead" style="margin-bottom:0" data-i18n="trainLead"></p>
        </div>
        <span class="progress-text" id="train-progress"></span>
      </div>
      <div class="progress"><span id="train-bar" style="width:0%"></span></div>
      <div id="train-area"></div>
    </section>

    <!-- ================= CÓMO FUNCIONA ================= -->
    <section id="panel-reglas" role="tabpanel" hidden>
      <h1 data-i18n="rulesTitle"></h1>
      <p class="lead" data-i18n="rulesLead"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="thRule"></th><th data-i18n="thExample"></th><th data-i18n="thWhy"></th><th data-i18n="thPoints"></th></tr></thead>
          <tbody id="rules-body"></tbody>
        </table>
      </div>
      <div class="block">
        <h2 data-i18n="levelsTitle"></h2>
        <div class="levels" id="levels"></div>
      </div>
      <div class="info">
        <div class="card"><h2 data-i18n="privacyTitle"></h2><p data-i18n="privacyText"></p></div>
        <div class="card"><h2 data-i18n="limitsTitle"></h2><p data-i18n="limitsText"></p></div>
      </div>
    </section>
  </main>

  <footer data-i18n="footer"></footer>
</div>

  // Decodificador punycode (RFC 3492) para mostrar cómo se ve un dominio xn--
  function punyDecode(input) {
    const base = 36, tMin = 1, tMax = 26, skew = 38, damp = 700;
    const adapt = (delta, numPoints, first) => {
      let k = 0;
      delta = first ? Math.floor(delta / damp) : delta >> 1;
      delta += Math.floor(delta / numPoints);
      while (delta > ((base - tMin) * tMax) >> 1) { delta = Math.floor(delta / (base - tMin)); k += base; }
      return Math.floor(k + ((base - tMin + 1) * delta) / (delta + skew));
    };
    const digitOf = (cp) => (cp >= 48 && cp <= 57) ? cp - 22 : (cp >= 65 && cp <= 90) ? cp - 65 : (cp >= 97 && cp <= 122) ? cp - 97 : base;
    const out = [];
    let n = 128, bias = 72, i = 0;
    const b = input.lastIndexOf("-");
    for (let j = 0; j < Math.max(b, 0); j++) out.push(input.charCodeAt(j));
    for (let idx = b > 0 ? b + 1 : 0; idx < input.length;) {
      const oldi = i;
      let w = 1;
      for (let k = base; ; k += base) {
        if (idx >= input.length) throw new Error("punycode");
        const digit = digitOf(input.charCodeAt(idx++));
        if (digit >= base) throw new Error("punycode");
        i += digit * w;
        const t = k <= bias ? tMin : k >= bias + tMax ? tMax : k - bias;
        if (digit < t) break;
        w *= base - t;
      }
      const len = out.length + 1;
      bias = adapt(i - oldi, len, oldi === 0);
      n += Math.floor(i / len);
      i %= len;
      out.splice(i++, 0, n);
    }
    return String.fromCodePoint(...out);
  }
  const showLabel = (label) => {
    if (!label.startsWith("xn--")) return label;
    try { return punyDecode(label.slice(4)); } catch (e) { return label; }
  };

  function levenshtein(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function normalizeGlyphs(s) {
    let r = "";
    for (const ch of s) r += HOMOGLYPHS[ch] || ch;
    return r.replace(/rn/g, "m").replace(/vv/g, "w");
  }

  // ¿Este fragmento del dominio coincide con (o imita a) una marca?
  function matchBrand(token) {
    if (token.length < 3) return null;
    const norm = normalizeGlyphs(token);
    for (const brand of BRANDS) {
      for (const key of brand.keys) {
        if (token === key) return { brand, key, kind: "exact" };
        if (norm === key) return { brand, key, kind: "glyph" };
        if (key.length >= 6 && !brand.noTypo) {
          const max = key.length >= 9 ? 2 : 1;
          const d = levenshtein(norm, key);
          if (d > 0 && d <= max) return { brand, key, kind: "typo", d };
          if (norm.length > key.length && (norm.startsWith(key) || norm.endsWith(key))) return { brand, key, kind: "contains" };
        }
      }
    }
    return null;
  }

  function tokensOf(label) {
    const shown = showLabel(label);
    const parts = shown.split("-").filter(Boolean);
    const set = new Set(parts);
    if (parts.length > 1) set.add(parts.join(""));
    return [...set];
  }

  function splitHost(host) {
    const labels = host.split(".").filter(Boolean);
    if (labels.length < 2) return { domain: host, sub: [], name: labels[0] || host, tld: "" };
    const n = MULTI_SUFFIX.has(labels.slice(-2).join(".")) && labels.length >= 3 ? 3 : 2;
    const dom = labels.slice(-n);
    return { domain: dom.join("."), sub: labels.slice(0, -n), name: dom[0], tld: labels[labels.length - 1] };
  }

  function officialBrand(host, domain) {
    for (const b of BRANDS) {
      for (const d of b.domains) {
        if (domain === d || host === d || host.endsWith("." + d)) return b;
      }
    }
    return null;
  }

  function parseInput(raw) {
    let s = (raw || "").trim().replace(/[​-‍﻿]/g, "");
    if (!s) return { error: "empty" };
    if (/\s/.test(s)) return { error: "invalid" };
    if (/^(javascript|data|vbscript|file|mailto|tel|ftp):/i.test(s)) return { error: "scheme" };
    const schemeGiven = /^[a-z][a-z0-9+.-]*:\/\//i.test(s);
    let url;
    try { url = new URL(schemeGiven ? s : "http://" + s); } catch (e) { return { error: "invalid" }; }
    if (url.protocol !== "http:" && url.protocol !== "https:") return { error: "scheme" };
    const host = url.hostname.toLowerCase();
    const isIP = /^\d{1,3}(\.\d{1,3}){3}$/.test(host) || host.startsWith("[");
    if (!host || (!isIP && !host.includes("."))) return { error: "invalid" };
    return { url, host, isIP, schemeGiven, raw: s };
  }

  function analyze(raw) {
    const p = parseInput(raw);
    if (p.error) return p;
    const { url, host, isIP, schemeGiven } = p;
    const parts = isIP ? { domain: host, sub: [], name: host, tld: "" } : splitHost(host);
    const official = isIP ? null : officialBrand(host, parts.domain);
    const hits = [];
    const notes = [];
    const add = (id, k, params) => { if (!hits.some((h) => h.id === id)) hits.push({ id, k, p: params || {}, pts: POINTS[id] }); };

    // R1 · IP en lugar de dominio
    if (isIP) add("R1", "ip", { ip: host });

    if (!isIP && !official) {
      // R2 · marca imitada o usada en un dominio ajeno
      for (const t of tokensOf(parts.name)) {
        const m = matchBrand(t);
        if (!m) continue;
        if (m.kind === "glyph" || m.kind === "typo") add("R2", m.kind, { token: t, key: m.key, brand: m.brand.name, d: m.d });
        else add("R2", "name", { brand: m.brand.name, domain: parts.domain });
        break;
      }
      if (/(^|-)(gob|gov)(-|$)/.test(parts.name)) add("R2", "gov", { domain: parts.domain });

      // R5 · marca o dominio falso delante del dominio real
      let subHit = null, fakeTld = false;
      parts.sub.forEach((label, idx) => {
        if (idx > 0 && TLD_LIKE.has(label)) fakeTld = true;
        for (const t of tokensOf(label)) {
          const m = matchBrand(t);
          if (m && !subHit) subHit = { m, t };
        }
      });
      if (subHit && (subHit.m.kind === "glyph" || subHit.m.kind === "typo")) {
        add("R2", subHit.m.kind, { token: subHit.t, key: subHit.m.key, brand: subHit.m.brand.name, d: subHit.m.d });
      }
      if (parts.sub.length && (subHit || fakeTld)) add("R5", "sub", { domain: parts.domain, sub: parts.sub.join(".") });
    }

    // R3 · punycode
    if (!isIP) {
      const puny = host.split(".").find((l) => l.startsWith("xn--"));
      if (puny && !official) add("R3", "puny", { label: host, decoded: host.split(".").map(showLabel).join(".") });
    }

    // R4 · símbolo @
    if (url.username) {
      let user = url.username;
      try { user = decodeURIComponent(user); } catch (e) { /* se deja tal cual */ }
      add("R4", "at", { user, host });
    }

    // R6 · acortadores
    if (SHORTENERS.has(parts.domain) || SHORTENERS.has(host)) add("R6", "short", { domain: parts.domain });

    // R7 · palabras cebo (no se aplica a dominios oficiales)
    if (!official) {
      let text = host + " " + url.pathname + " " + url.search;
      try { text = decodeURIComponent(text); } catch (e) { /* ignorar */ }
      text = text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      const found = BAIT.filter((w) => text.includes(w));
      const words = found.filter((w) => !found.some((o) => o !== w && o.includes(w))).slice(0, 4);
      if (words.length) add("R7", "bait", { words: words.join(", ") });
    }

    // R8 · sin HTTPS
    if (schemeGiven && url.protocol === "http:") add("R8", "http");
    if (!schemeGiven) notes.push({ k: "noScheme" });

    // R9 · enlace largo o muchos subdominios
    const hyphens = (host.match(/-/g) || []).length;
    if (p.raw.length > 75) add("R9", "len", { n: p.raw.length });
    else if (parts.sub.length > 3) add("R9", "subs", { n: parts.sub.length });
    else if (hyphens >= 4) add("R9", "hyph", { n: hyphens });

    // R10 · extensión engañosa
    if (FILE_TLD.has(parts.tld)) add("R10", "file", { tld: parts.tld });
    else if (CHEAP_TLD.has(parts.tld)) add("R10", "cheap", { tld: parts.tld });

    if (official) notes.unshift({ k: "official", brand: official.name });

    const score = Math.min(100, hits.reduce((s, h) => s + h.pts, 0));
    const level = score >= 60 ? "high" : score >= 30 ? "med" : "low";
    hits.sort((a, b) => b.pts - a.pts || RULE_IDS.indexOf(a.id) - RULE_IDS.indexOf(b.id));

    // Partes del enlace para la "anatomía"
    const segs = [];
    if (schemeGiven) segs.push({ cls: "scheme", text: url.protocol + "//" });
    if (url.username) segs.push({ cls: "user", text: url.username + (url.password ? ":" + url.password : "") + "@" });
    if (parts.sub.length) segs.push({ cls: "sub", text: parts.sub.join(".") + "." });
    segs.push({ cls: "dom", text: parts.domain + (url.port ? ":" + url.port : "") });
    const path = url.pathname + url.search + url.hash;
    if (path && path !== "/") segs.push({ cls: "path", text: path });
    const decodedHost = host.split(".").map(showLabel).join(".");

    return { hits, notes, score, level, official, segs, idn: decodedHost !== host ? decodedHost : null,
      passed: RULE_IDS.filter((id) => !hits.some((h) => h.id === id)) };
  }

     ===================================================================== */
  function el(tag, props, ...kids) {
    const node = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "style") node.style.cssText = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t()[n.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-ph]").forEach((n) => { n.placeholder = t()[n.dataset.i18nPh]; });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    renderExamples();
    renderRules();
  }

  function renderExamples() {
    const box = $("examples");
    box.replaceChildren(el("span", { text: t().examples }),
      ...EXAMPLES.map((ex, i) => el("button", { type: "button", class: "chip", id: "ex-" + i, onclick: () => { $("url").value = ex.url; runAnalysis(); } }, ex[lang])));
  }

  let lastInput = "";
  function runAnalysis() {
    lastInput = $("url").value;
    renderResult(analyze(lastInput));
  }

  function renderResult(res) {
    const box = $("resultado");
    const L = t();
    if (res.error) {
      box.replaceChildren(el("div", { class: "error", role: "alert" }, L.errors[res.error]));
      return;
    }
    const lvlClass = { low: "lvl-low", med: "lvl-med", high: "lvl-high" }[res.level];
    const adv = res.official && res.level === "low" ? L.advice.official : L.advice[res.level];
    const brandName = res.official ? res.official.name : "";

    const verdict = el("div", { class: "card verdict" },
      el("div", { class: "light", "aria-hidden": "true" },
        el("div", { class: "lamp r" + (res.level === "high" ? " on" : "") }),
        el("div", { class: "lamp a" + (res.level === "med" ? " on" : "") }),
        el("div", { class: "lamp g" + (res.level === "low" ? " on" : "") })),
      el("div", null,
        el("p", { class: "level" }, L.levels[res.level]),
        el("p", { class: "score" }, String(res.score), el("small", null, " / 100")),
        el("div", { class: "meter", role: "img", "aria-label": res.score + " / 100" }, el("span", { style: "width:" + res.score + "%" }))),
      el("div", { class: "advice" }, el("strong", null, adv[0].replace("{brand}", brandName)), el("p", null, adv[1])),
      el("p", { class: "disclaimer" }, L.disclaimer));

    const anatomy = el("div", { class: "anatomy" },
      res.segs.map((s) => el("span", { class: "seg " + s.cls }, el("code", null, s.text), el("small", null, L.seg[s.cls]))));

    const reasons = res.hits.length
      ? el("ol", { class: "reasons" }, res.hits.map((h) => {
          const rule = L.rules[h.id];
          return el("li", null,
            el("span", { class: "pts" + (h.pts >= 25 ? " big" : "") }, "+" + h.pts),
            el("div", null, el("b", null, el("span", { class: "rid" }, h.id), rule.name), el("p", null, rule.msg[h.k](h.p))));
        }))
      : el("p", { class: "none" }, L.noHits);

    const notes = res.notes.length
      ? el("ul", { class: "notes" }, res.notes.map((n) => el("li", null, L.notes[n.k].replace("{brand}", n.brand || ""))))
      : null;

    const detail = el("div", { class: "card" },
      el("h2", null, L.anatomy), anatomy,
      res.idn ? el("p", { class: "idn" }, L.idn + " ", el("code", null, res.idn)) : null,
      el("h2", { style: "margin-top:22px" }, L.why), reasons, notes,
      res.passed.length ? el("div", { class: "passed" },
        el("span", { class: "eyebrow" }, L.passed),
        el("div", { class: "passed-list" }, res.passed.map((id) => el("span", { class: "ok", title: L.rules[id].name }, id + " · " + L.rules[id].name)))) : null);

    box.replaceChildren(el("div", { class: "grid " + lvlClass }, verdict, detail));
  }

  /* ---------- modo entrenamiento ---------- */
  const train = { i: 0, score: 0, answer: null, done: false };

  function renderTraining() {
    const L = t();
    const cases = L.cases;
    const area = $("train-area");
    const answered = train.answer !== null;
    const progressIdx = train.done ? cases.length : train.i + (answered ? 1 : 0);
    $("train-bar").style.width = (progressIdx / cases.length) * 100 + "%";
    $("train-progress").textContent = L.caseOf(Math.min(train.i + 1, cases.length), cases.length, train.score);

    if (train.done) {
      const k = train.score, n = cases.length;
      const msg = k >= 9 ? L.endMsg.top : k >= 6 ? L.endMsg.mid : L.endMsg.low;
      area.replaceChildren(el("div", { class: "card end" },
        el("span", { class: "eyebrow" }, L.endTitle),
        el("p", { class: "big" }, k + " / " + n),
        el("p", null, L.endScore(k, n) + " " + msg),
        el("div", { class: "actions" }, el("button", { type: "button", class: "btn-primary", id: "btn-restart", onclick: () => { Object.assign(train, { i: 0, score: 0, answer: null, done: false }); renderTraining(); } }, L.restart))));
      return;
    }

    const c = cases[train.i];
    const isEmail = c.ch === "email";
    const bodyNode = isEmail
      ? el("div", { class: "msg-body" }, el("p", null, c.body), c.link ? el("span", { class: "fake-link" }, c.link) : null)
      : el("div", { class: "msg-body" }, el("div", { class: "bubble" }, el("p", null, c.body), c.link ? el("span", { class: "fake-link" }, c.link) : null));

    const pick = (choice) => {
      if (train.answer !== null) return;
      train.answer = choice;
      if (choice === c.answer) train.score++;
      renderTraining();
    };

    const message = el("div", null,
      el("div", { class: "msg" },
        el("div", { class: "msg-top" }, el("span", { class: "channel" }, L.channel[c.ch]),
          el("span", { class: "fict" }, c.ch === "chat" ? "" : "(" + L.fictional + ")")),
        el("div", { class: "msg-meta" },
          el("div", null, el("span", null, L.from), el("span", { class: "from" }, c.from)),
          isEmail ? el("div", null, el("span", null, L.subject), el("strong", null, c.subject)) : null),
        bodyNode),
      el("div", { class: "choices" },
        el("button", { type: "button", id: "btn-legit", class: "choice legit" + (train.answer === "legit" ? " picked" : ""), disabled: answered, onclick: () => pick("legit") }, L.legit),
        el("button", { type: "button", id: "btn-phish", class: "choice phish" + (train.answer === "phish" ? " picked" : ""), disabled: answered, onclick: () => pick("phish") }, L.phish)));

    let side;
    if (!answered) {
      side = el("div", { class: "hint" }, L.pickHint);
    } else {
      const ok = train.answer === c.answer;
      const last = train.i === cases.length - 1;
      side = el("div", { class: "feedback " + (ok ? "good" : "bad"), role: "status" },
        el("h3", null, ok ? L.correct : L.wrong),
        el("p", { class: "sub" }, c.answer === "phish" ? L.wasPhish : L.wasLegit),
        el("ul", { class: "clues" }, c.clues.map((x) => el("li", null, x))),
        el("div", { class: "actions" },
          c.link ? el("button", { type: "button", class: "btn-ghost", id: "btn-check-link", onclick: () => { $("url").value = c.link; showTab("analizar"); runAnalysis(); window.scrollTo({ top: 0 }); } }, L.analyzeLink) : null,
          el("button", { type: "button", class: "btn-primary", id: "btn-next", onclick: () => { if (last) train.done = true; else { train.i++; } train.answer = null; renderTraining(); } }, last ? L.finish : L.next)));
    }
    area.replaceChildren(el("div", { class: "train-grid" }, message, side));
  }

  /* ---------- cómo funciona ---------- */
  function renderRules() {
    const L = t();
    $("rules-body").replaceChildren(...RULE_IDS.map((id) => {
      const r = L.rules[id];
      return el("tr", null, el("td", null, el("b", null, id + ". "), r.name), el("td", null, el("code", null, r.ex)), el("td", null, r.why), el("td", { class: "num" }, "+" + POINTS[id]));
    }));
    const ranges = { low: "0 – 29", med: "30 – 59", high: "60 – 100" };
    $("levels").replaceChildren(...["low", "med", "high"].map((k) =>
      el("div", { class: "lv lvl-" + k }, el("b", null, L.levels[k]), el("span", null, ranges[k]), el("p", null, L.levelText[k]))));
  }

  /* ---------- pestañas e idioma ---------- */
  const TABS = ["analizar", "entrenar", "reglas"];
  function showTab(name) {
    if (!TABS.includes(name)) name = "analizar";
    TABS.forEach((tab) => {
      $("panel-" + tab).hidden = tab !== name;
      $("tab-" + tab).setAttribute("aria-selected", String(tab === name));
    });
    try { history.replaceState(null, "", "#" + name); } catch (e) { /* sin historial */ }
  }
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("apl-lang", lang); } catch (e) { /* sin almacenamiento */ }
    applyStatic();
    renderResult(analyze(lastInput));
    renderTraining();
  }));
  $("form-analizar").addEventListener("submit", (e) => { e.preventDefault(); runAnalysis(); });

  // Estado inicial: un ejemplo ya analizado para que se vea cómo funciona
  applyStatic();
  $("url").value = EXAMPLES[0].url;
  runAnalysis();
  renderTraining();
  showTab((location.hash || "").slice(1));
})();
</script>
</body>
</html>
